name: CI

# Lint, type check, tests and build on every pull request and on develop, so a broken change is
# caught before the merge into main (which publishes, see npm-publish.yml).
on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run type-check
      # The browser tests sometimes lose the page (Chrome drops an import or closes, or a run
      # hangs): each attempt is capped at 10 minutes, and one rerun is flagged as a warning. A real
      # failure fails twice and still stops the job.
      - name: Test (one rerun if the browser drops)
        run: timeout 10m npm run test || { echo "::warning::Tests failed or hung, rerunning once"; timeout 10m npm run test; }
      - run: npm run build
