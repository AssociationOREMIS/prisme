name: CI

# Lint, type check, tests and build on every pull request and on develop, so a broken change is
# caught before the merge into main (which publishes, see npm-publish.yml).
on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run type-check
      # The browser tests sometimes lose the page (Chrome drops an import or closes): one rerun,
      # flagged as a warning. A real failure fails twice and still stops the job.
      - name: Test (one rerun if the browser drops)
        run: npm run test || { echo "::warning::Tests failed, rerunning once"; npm run test; }
      - run: npm run build
