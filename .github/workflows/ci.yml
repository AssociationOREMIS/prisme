name: CI

# Type check, tests and build on every pull request and on develop, so a broken change is
# caught before the merge into main (which publishes, see npm-publish.yml).
on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run type-check
      - run: npm run test
      - run: npm run build
