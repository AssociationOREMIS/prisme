name: Publish package to npm

# Merging develop into main publishes the version written in package.json, then tags it
# (vX.Y.Z) with a GitHub release taken from CHANGELOG.md. A merge that keeps an already
# released version publishes nothing. Everything happens in this one workflow: a tag pushed
# by a workflow does not trigger other workflows, and npm's trusted publishing is bound to
# this file name.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  version:
    # A manual run from another branch must never publish it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
      published: ${{ steps.version.outputs.published }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Version to release
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::notice::$tag est deja publiee : changez la version dans package.json pour publier."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

          if ! grep -qE "^## $(printf '%s' "$version" | sed 's/\./\\./g')( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md n'a pas de section '## $version (AAAA-MM-JJ)'."
            exit 1
          fi

          # Published by an earlier run that failed before tagging: only the tag is missing.
          if npm view "@oremis/prisme@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    # Tests run with read-only rights: no dependency install script can reach the publish token.
    needs: version
    if: needs.version.outputs.release == 'true' && needs.version.outputs.published == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run type-check
      # The browser tests sometimes lose the page (Chrome drops an import or closes, or a run
      # hangs): each attempt is capped at 10 minutes, and one rerun is flagged as a warning. A real
      # failure fails twice and still stops the job.
      - name: Test (one rerun if the browser drops)
        run: timeout 10m npm run test || { echo "::warning::Tests failed or hung, rerunning once"; timeout 10m npm run test; }
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # A prerelease (1.0.0-beta.1) must not become the "latest" version apps install.
          case "$VERSION" in
            *-*) npm publish --access public --ignore-scripts --tag next ;;
            *) npm publish --access public --ignore-scripts ;;
          esac

  release:
    needs: [version, publish]
    # Also runs when only the tag was missing (publish skipped because already on npm).
    if: always() && needs.version.outputs.release == 'true' && (needs.publish.result == 'success' || needs.version.outputs.published == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # The "## X.Y.Z (date)" section of CHANGELOG.md, without its heading.
          awk -v v="$VERSION" '
            index($0, "## " v " ") == 1 || $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file release-notes.md $prerelease
